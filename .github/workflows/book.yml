name: Build & deploy the book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "ugm/**"
      - "pyproject.toml"
      - ".github/workflows/book.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r book/requirements.txt

      - name: Build the ugm wheel (for the in-browser Pyodide engine)
        run: |
          python -m build --wheel --outdir book/docs/wheels .
          echo "Built wheels:"
          ls -l book/docs/wheels

      #  A wheel that EXISTS is not a wheel that IMPORTS, and `ls` cannot
      # tell them apart. `packages = ["ugm"]` shipped four files and none of
      # `ugm/core`, so every wheel this job published for the playground raised
      # ModuleNotFoundError on `import ugm` -- for as long as the tree has had
      # subpackages, with a green build every time. Install it somewhere clean
      # and run the thing.
      - name: Smoke-test the wheel (it must import and run, not merely exist)
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet book/docs/wheels/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import ugm
          from ugm.core.machine import Machine
          from ugm.core.text import load
          m = Machine()
          kb = load(m, "rule <r> = implies( { +p(?x) }, { +q(?x) } )\nfact +p(a)\n")
          m.run(limit=20)
          assert m.holds(kb.term("q(a)")) == "+", "the wheel imports but does not reason"
          import ugm.corpora, importlib.resources as r
          assert (r.files("ugm") / "rules" / "bundle.ugm").is_file(), "the bundle corpus is missing from the wheel"
          print("wheel ok:", ugm.__name__, "->", m.holds(kb.term("q(a)")))
          PY

      - name: Build the MkDocs site
        run: mkdocs build --strict --site-dir site
        working-directory: book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
