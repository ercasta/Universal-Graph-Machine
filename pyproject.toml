[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-graph-machine"
version = "0.2.0"
description = "Universal Graph Machine — microfunctions over a named-edge graph: goals, planning, and answers that carry their own proof"
readme = { text = "Universal Graph Machine", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["graph", "reasoning", "knowledge-representation", "planning", "agent"]
dependencies = []

# Verification is `python -m microfunctions.selftest` — 132 checks, 0 FAILED — not pytest.
# ⚠ That is a deliberate consequence of retiring `ugm/`: 92 of the 94 pytest files existed to test it,
# so they went with it. The selftest is a single runner that reports every check's keys and counts any
# `False` as a failure.

[tool.setuptools]
packages = ["microfunctions"]

[tool.setuptools.package-data]
microfunctions = ["rules/*.mf"]
