[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-graph-machine"
version = "0.3.0"
description = "Universal Graph Machine — microfunctions over a named-edge graph: goals, planning, and answers that carry their own proof"
readme = { text = "Universal Graph Machine", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["graph", "reasoning", "knowledge-representation", "planning", "agent"]
dependencies = []

# Verification is `python -m ugm.selftest`, not pytest: a single runner that prints every check's
# named observations and counts any False as a failure.

[tool.setuptools]
packages = ["ugm"]

[tool.setuptools.package-data]
ugm = ["rules/*.mf"]
