site_name: The Universal Graph Machine
site_description: A machine that reasons — and can always show its work. A tutorial for curious beginners.
site_url: https://ercasta.github.io/Universal-Graph-Machine/
repo_url: https://github.com/ercasta/Universal-Graph-Machine
repo_name: ercasta/Universal-Graph-Machine
copyright: >
  Made with care for anyone curious about how machines can reason ·
  <a href="https://github.com/ercasta/Universal-Graph-Machine">View the project on GitHub</a>

# Simpler, deterministic paths (playground/detective.html) so the live pages
# can reference the Pyodide wheel with a plain relative URL.
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/playground.js

nav:
  - Home: index.md
  - "Part 1 — Basic":
      - "0 · A machine that shows its work": basic/00-a-machine-that-explains-itself.md
      - "1 · The substrate": basic/01-the-substrate.md
      - "2 · Telling it things": basic/02-facts.md
      - "3 · Asking: yes, no, and I don't know": basic/03-questions.md
      - "4 · A rule is a little program you point at": basic/04-rules.md
  - "Part 2 — Intermediate":
      - "5 · Wanting something": intermediate/05-wanting-something.md
      - "6 · Imagining": intermediate/06-imagining.md
      - "7 · Finding a plan": intermediate/07-finding-a-plan.md
      - "8 · Because…": intermediate/08-because.md
      - "9 · Talking to it": intermediate/09-talking-to-it.md
  - "Part 3 — Advanced":
      - "10 · When reality disagrees": advanced/10-when-reality-disagrees.md
      - "11 · Contingencies and replanning": advanced/11-contingencies.md
      - "12 · What it may never do": advanced/12-what-it-may-never-do.md
      - "13 · Remembering": advanced/13-remembering.md
      - "14 · Learning from what it did": advanced/14-learning.md
      - "15 · When two intentions collide": advanced/15-collisions.md
  - "Part 4 — Deliberation":
      - "16 · Choosing what to do next": deliberation/16-choosing-what-to-do-next.md
      - "17 · Advice it may ignore": deliberation/17-advice-it-may-ignore.md
      - "18 · Recipes, and rules you must follow": deliberation/18-recipes-and-rules.md
      - "19 · Not knowing": deliberation/19-not-knowing.md
  - "Part 5 — The internals":
      - "20 · The instruction set": deep/20-instruction-set.md
      - "21 · Types as shapes": deep/21-types-as-shapes.md
      - "22 · Reading a rule": deep/22-reading-a-rule.md
      - "23 · Concluding versus acting": deep/23-concluding-vs-acting.md
  - "Part 6 — Watching itself":
      - "24 · What it saw, and whether it was me": watching/24-what-it-saw.md
      - "25 · One loop, and everything on it": watching/25-one-loop.md
      - "26 · Noticing it's taking too long": watching/26-taking-too-long.md
      - "27 · Forgetting is the default": watching/27-forgetting.md
      - "28 · What, where, and when": watching/28-what-where-when.md
  - "Part 7 — Out in the world":
